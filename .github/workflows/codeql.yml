# Reusable CodeQL analysis for JavaScript and TypeScript repositories.
#
# Call from a repository workflow:
#
#   jobs:
#     analyze:
#       uses: Iwwwan-labs/.github/.github/workflows/codeql.yml@main
#
# The workflow runs in the caller repository context and uploads results to
# that repository's code-scanning alerts.

name: CodeQL

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
